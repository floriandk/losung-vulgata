<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Losung &amp; Vulgata</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2b2420;--muted:#7a6f64;--accent:#8a2f2f;--line:#e2d9c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#26211e;--ink:#eee6d8;--muted:#a79b8c;--accent:#e08a7a;--line:#3a332e}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:1.5rem;margin:0 0 2px}
.date{color:var(--muted);font-style:italic;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.label{font:600 .72rem/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:6px}
.ref{font-weight:bold;margin:0 0 10px}.hint,.miss{color:var(--muted);font-weight:normal;font-size:.85rem}
.vul{font-size:1.2rem;margin:0 0 12px}sup{color:var(--accent);font-size:.65em;margin-right:2px}
summary{cursor:pointer;color:var(--accent);font:600 .9rem system-ui,sans-serif;padding:6px 0}
.de{margin:8px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.note{color:var(--muted);font:.8rem system-ui,sans-serif;margin-top:22px}
</style>
</head>
<body><main>
<h1>Losung &amp; Vulgata</h1>
<p class="date">{{DATUM}}</p>
{{CARDS}}
<p class="note">Losung und Lehrtext © Evangelische Brüder-Unität – Herrnhuter Brüdergemeine, <a href="https://www.losungen.de/">losungen.de</a>. Vulgata (Clementina): gemeinfrei.</p>
</main></body>
</html>
